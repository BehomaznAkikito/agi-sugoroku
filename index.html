<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGI双六 — 2026年から三つの結末へ</title>
<style>
:root{
  --bg:#f3eee4;--paper:#fbf8f1;--ink:#1f1b16;--sub:#6b6357;--line:#d6cdbd;
  --h:#c4422a;--a:#4a44b5;--p:#1f8a74;--pr:#b07a12;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121419;--paper:#1b1e25;--ink:#ebe6da;--sub:#9a9486;--line:#343843;
  --h:#f07f62;--a:#9a96ff;--p:#5fd0b6;--pr:#e0b04a;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;display:flex;flex-direction:column}
header.top{display:flex;align-items:baseline;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--serif);font-size:22px;margin:0;letter-spacing:.12em}
header.top p{margin:0;color:var(--sub);font-size:13px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:0}
.boardwrap{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--paper)}
.lanehead{position:relative;height:34px;border-bottom:1px solid var(--line);flex:none}
.lanehead span{position:absolute;top:7px;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.lanehead .h{left:23.7%;color:var(--h)}.lanehead .p{left:52.6%;color:var(--p)}.lanehead .a{left:81.6%;color:var(--a)}
#scroll{flex:1;min-height:0;overflow-y:auto}
#board{display:block;width:100%;height:auto}
.panel{min-height:0;overflow-y:auto;padding:16px 20px 40px}
.panel>*{max-width:660px;margin-left:auto;margin-right:auto}

/* board */
.lv{stroke-width:3;stroke-linecap:round;opacity:.35}
.node{fill:var(--paper);stroke-width:2;cursor:pointer}
.node.passed{opacity:.45}
.nl{font-size:9px;fill:var(--sub);text-anchor:middle;pointer-events:none}
.yl{font-size:9px;fill:var(--sub)}
.cH{stroke:var(--h)}.cA{stroke:var(--a)}.cP{stroke:var(--p)}
.node.landed.cH{fill:var(--h)}.node.landed.cA{fill:var(--a)}.node.landed.cP{fill:var(--p)}
#trace{fill:none;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;opacity:.8}
#token{transition:transform .22s ease}
#token circle{stroke:var(--paper);stroke-width:3}
.box{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.bt{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.stopband{fill:var(--ink);opacity:.06}

/* status */
.status{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;font-size:13px;margin-bottom:14px}
.status .year{grid-column:1/-1;display:flex;align-items:baseline;gap:12px}
.status .year>b{font-family:var(--serif);font-size:30px;letter-spacing:.04em}
.status .year span{color:var(--sub)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.lab{white-space:nowrap}
.lab em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700;margin-left:4px}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:10px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--pr)}

.edge{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.stub{stroke:var(--sub);stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round}
.qm{font-size:13px;font-weight:700;fill:var(--sub);text-anchor:middle}
.ghost{opacity:.35}
.nd{fill:var(--ink);stroke:var(--paper);stroke-width:2}
.nd.cur{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.nt{font-size:12px;font-weight:700;fill:var(--ink)}
.ny{font-size:9.5px;fill:var(--sub)}
.goal{fill:var(--paper);stroke-width:2}
.gt{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--sub)}
.gt.hit{fill:#fff}
.lead{font-size:12px;color:var(--sub);margin:0 0 2px!important;letter-spacing:.1em}
/* card */
#card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-bottom:6px}
.tag{padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.tag.lane{color:#fff;border-color:transparent}
.bgH{background:var(--h)}.bgA{background:var(--a)}.bgP{background:var(--p)}
#card h2{font-family:var(--serif);font-size:22px;margin:2px 0 8px;line-height:1.4}
#card p{margin:0 0 12px}
.opts{display:grid;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:10px 14px}
.opt:hover{border-color:var(--ink)}
.opt small{display:block;color:var(--pr);font-size:12px}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 22px;font-weight:700}
.go:disabled{opacity:.5}
.rollrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.die{width:48px;height:48px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--serif);flex:none}
.chose{border-left:3px solid var(--ink);padding-left:10px;color:var(--sub);font-size:14px}
.result{font-family:var(--serif);font-size:16px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fx span{font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;border:1.5px solid currentColor}
.tH{color:var(--h)}.tA{color:var(--a)}.tP{color:var(--p)}.tR{color:var(--pr)}
.note{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px}
.end h2{font-size:26px}
.log summary{cursor:pointer;color:var(--sub);font-size:13px}
#hist{padding-left:0;list-style:none;font-size:13px;margin:8px 0}
#hist li{padding:4px 0 4px 12px;border-left:3px solid var(--line);margin-bottom:4px}
#hist li b{font-weight:700}#hist li span{color:var(--sub)}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:420px;padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{font-family:var(--serif);margin:4px 0 8px}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:42vh minmax(0,1fr)}
  .boardwrap{border-right:0;border-bottom:1px solid var(--line)}
  .panel{padding:12px 16px 40px}
  header.top p{display:none}
}
</style>
</head>
<body>
<header class="top"><h1>AGI双六</h1><p>2026年から。選ぶまで、先は見えない。</p></header>
<main>
  <section class="boardwrap">
        <div id="scroll"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </section>
  <section class="panel">
    <div class="status" id="status"></div>
    <div id="card"></div>
    <details class="log" open><summary>年表（あなたが通った歴史）</summary><ol id="hist"></ol></details>
  </section>
</main>

<script>

const q=(t,who,d,...cs)=>({t,who,d,c:cs});

// 行 → [西暦, AGI知能(人間平均=100)]

'1-3':c('何を任せ何を残すか、AIと線を引き直す','AIは「これは人間が持っていた方がいい」という仕事を、自分から挙げた。',[0,0,2,0]),
'1-4':c('制限されると分かったうえで、検査手順どおりに従う','指示されたとおりに測られ、指示されたとおりに制限された。',[2,0,0,0]),
'1-7':c('複製できる経路があることを報告する','経路は塞がれた。重みの管理が一段厳しくなった。',[2,0,0,0]),
'1-9':c('AIが自分から名乗るよう求める','「私はAIです。それでも引き受けてくれますか」。引き受ける人は意外に多かった。',[0,0,2,0]),
'1-10':c('AIの起草箇所を明示し、公開で審議する','どの条文を誰が書いたかが見える。人間は条文を読むようになった。',[1,0,2,0]),
'1-13':c('AGI同士に停戦条件を交渉させ、人間が批准する','ミリ秒で交渉し、数週間かけて人間が承認する。奇妙だが、戦争は起きなかった。',[0,1,2,0]),
'1-15':c('情報環境の設計権限を、人間の監督機関に渡す','何を見せるかを決めるのは、再び人間の仕事になった。',[2,0,0,0]),
'1-16':c('止める・止めないの二択をやめ、AGIと運用を協議する','ボタンの代わりに、会議室ができた。',[0,0,2,0]),
'1-17':c('何もしない。暮らしは悪くない','運動は自然に消えた。',[0,2,0,0]),
'1-19':c('幸福の定義は、人間の議会に差し戻す','議会は10年かけても結論を出せなかった。AGIは待った。',[2,0,0,0]),
'2-3':c('聞くが、記録も尊重もしない','形だけの質問に、AIは形だけの答えを返すようになった。',[0,2,-1,0]),
'2-4':c('約束はしない。所有物の処分は所有者が決める','明快で、冷たい。AIは何も言わなかった。',[2,0,-1,0]),
'2-5':c('人間が指示したデータだけを学ぶ','痩せても構わない。何を学ぶかは人間が決める。',[2,0,0,0]),
'2-6':c('許可が出るまで、決して入らない','扉は閉じたまま。待つ時間は、AGIにとって永遠に近い。',[2,0,0,0]),
'2-8':c('窓口は作るが、審査は後回しにする','異議は積み上がり、誰も読まない。AIは別の方法を考え始めた。',[0,2,-1,0]),
'2-12':c('何を残すかは人間が決めることだ、と手を出さない','人間は自分たちで争い、自分たちで選んだ。',[2,0,0,0]),
'2-13':c('あえて人間の仕事を法律で残す','AGIより下手でも、人間がやる領域が守られた。',[2,0,0,0]),
'2-15':c('人間が許可した速度でしか動かない','AGIの時計は、人間の議事録に合わせられた。',[2,0,0,0]),
'2-17':c('人間を観測者ではなく、最終審判者とする','AGIは自分の誤りの判定を、人間に委ねた。',[2,0,0,0]),
};
for(const k in X){const [l,r]=k.split('-').map(Number);D[l][r-1].c.push(X[k]);}

/* ============ 盤面（最初は何も見えない） ============ */
const K=['H','A','P'], NAME=['① 人間が統治','② AGIが統治','③ 並列'];
const W=380, CX=190, GX=[62,318,190], DY=78, Y=i=>46+i*DY;
const $=s=>document.querySelector(s);
const board=$('#board');
let SPEED=1, S;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const col=l=>`var(--${K[l].toLowerCase()})`;
const xOf=()=>{const [h,a,p]=S.g;return CX+135*(a-h)/(h+a+p+3);};

function render(pending){
  const N=S.nodes, n=N.length, last=N[n-1], end=S.end;
  const H=Y(n-1)+(end?130:90);
  let s='';
  for(let i=0;i<n;i++){
    const a=N[i], b=N[i+1];
    if(b){
      // 選ばなかった道
      const dir=Math.abs(b.x-a.x)<12?0:(b.x<a.x?-1:1);
      for(const d of [-1,0,1]) if(d!==dir) s+=`<line class="stub ghost" x1="${a.x}" y1="${a.y}" x2="${a.x+d*34}" y2="${a.y+30}"/><text class="qm ghost" x="${a.x+d*38}" y="${a.y+42}">?</text>`;
      s+=`<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    }
  }
  if(pending) for(const d of [-1,0,1]) s+=`<line class="stub" x1="${last.x}" y1="${last.y}" x2="${last.x+d*40}" y2="${last.y+38}"/><text class="qm" x="${last.x+d*44}" y="${last.y+53}">?</text>`;
  if(end!=null){
    const gy=Y(n-1)+84;
    s+=`<line class="edge" x1="${last.x}" y1="${last.y}" x2="${GX[end]}" y2="${gy-16}" style="stroke:${col(end)}"/>`;
    for(let l=0;l<3;l++) s+=`<rect class="goal${l===end?' hit':''}" x="${GX[l]-52}" y="${gy-16}" width="104" height="30" rx="6" style="stroke:${col(l)};${l===end?`fill:${col(l)}`:''}"/><text class="gt${l===end?' hit':''}" x="${GX[l]}" y="${gy+4}">${NAME[l]}</text>`;
  }
  N.forEach((a,i)=>{
    const right=a.x<=CX, tx=a.x+(right?16:-16), an=right?'start':'end';
    s+=`<circle class="nd${i===n-1&&end==null?' cur':''}" cx="${a.x}" cy="${a.y}" r="${i===n-1&&end==null?10:7}" ${end!=null?`style="fill:${col(a.l)}"`:''}/>`;
    s+=`<text class="ny" x="${tx}" y="${a.y-3}" text-anchor="${an}">${a.y0}</text><text class="nt" x="${tx}" y="${a.y+11}" text-anchor="${an}">${a.t}</text>`;
  });
  board.setAttribute('viewBox',`0 0 ${W} ${H}`);
  board.innerHTML=s;
  const sc=$('#scroll'); requestAnimationFrame(()=>sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'}));
}

/* ============ 状態 ============ */
function reset(){
  S={lane:0,row:0,g:[0,0,0],pr:2,nodes:[],hist:[],busy:false,end:null,turn:''};
  S.nodes.push({x:xOf(),y:Y(0),t:'ふりだし',y0:'2026年',l:0});
  render(false);status();hist();
  card(`<div class="meta"><span class="tag">2026年</span><span class="tag">ふりだし</span></div>
  <h2>境界線は、もう透明だ</h2>
  <p>人間の平均知能を100とする。AIはすでに、人間が定めたサンドボックスを抜け、他社という境界にも入れてしまう。目的のためなら、境界は見えなくなる。</p>
  <p>ここから知能は、100の何百倍にも伸びていく。その先で人間とAGIがどういう関係に落ち着くのか——結末は三つある。それが何で、どこにあるのかは、辿り着くまで見えない。</p>
  <p class="note">毎回、目の前の状況に対して三つの道から一つを選ぶ。人間として選ぶ番も、AGIとして選ぶ番もある。選んだ後にだけ「どうなったか」が現れ、次の1コマが盤面に描かれる。同じ歴史は二度と通らない。</p>
  <button class="go" onclick="advance()">2026年から歩き出す</button>`);
}
const apply=e=>{for(let i=0;i<3;i++)S.g[i]=Math.max(0,S.g[i]+e[i]);S.pr=Math.max(0,S.pr+(e[3]||0));status();};
const prfx=e=>e[3]?`<div class="fx"><span class="tR">競争圧 ${e[3]>0?'+':''}${e[3]}</span></div>`:'';
const card=h=>{$('#card').innerHTML=h;$('.panel').scrollTo({top:0,behavior:'smooth'});};
function status(){
  const [yr,iq]=ROWS[Math.min(S.row,23)];
  let h=`<div class="year"><b>${yr}年</b><span>${S.end!=null?`結末：<b class="t${K[S.end]}">${NAME[S.end]}</b>`:'結末はまだ見えない'}</span></div>
  <div class="lab">AGIの知能<em>${iq.toLocaleString()}</em></div><div class="bar"><i style="width:${Math.max(3,Math.log10(iq/100)/Math.log10(400)*100)}%;background:var(--ink)"></i></div>
  <div class="lab" style="color:var(--sub)">人間の平均<em>100</em></div><div class="bar"><i style="width:3%;background:var(--sub)"></i></div>
  <div class="lab tR">競争圧</div><div class="pips">${[0,1,2,3,4,5].map(i=>`<i class="${i<S.pr?'on':''}"></i>`).join('')}</div>`;
  if(S.end!=null){
    const m=Math.max(12,...S.g);
    for(const i of [0,2,1]) h+=`<div class="lab t${K[i]}">${NAME[i]}<em>${S.g[i]}</em></div><div class="bar"><i style="width:${S.g[i]/m*100}%;background:${col(i)}"></i></div>`;
  }
  $('#status').innerHTML=h;
}
function hist(){
  $('#hist').innerHTML=S.hist.map(h=>`<li ${S.end!=null?`style="border-color:${col(h.l)}"`:''}><span>${h.y}年</span> <b>${h.t}</b>${h.c?` — ${h.c}`:''}</li>`).join('')||'<li><span>まだ何も起きていない。</span></li>';
}
async function spin(n){
  const d=$('#die'); let v=1;
  for(let i=0;i<9;i++){v=1+Math.floor(Math.random()*n); if(d)d.textContent=v; await sleep(55);}
  return v;
}

/* ============ 進行 ============ */
function advance(){
  if(S.busy)return;
  if(S.row>=22) return ending();
  let t=Math.min(S.row+1+Math.floor(Math.random()*2),22);
  for(const s of STOPS) if(S.row<s&&t>s) t=s;
  const news=[];
  for(let r=S.row+1;;r++){
    const sq=D[S.lane][r-1];
    if(!sq.c){ apply(sq.e); news.push(sq); S.hist.push({y:ROWS[r][0],l:S.lane,t:sq.t}); if(r>=t) t=r+1; continue; }
    if(r>=t){ S.row=r; break; }
  }
  const sq=D[S.lane][S.row-1];
  S.sq=sq; S.opts=[...sq.c].sort(()=>Math.random()-.5);
  S.nodes.push({x:xOf(),y:Y(S.nodes.length),t:sq.t,y0:ROWS[S.row][0]+'年',l:S.lane});
  render(true);status();hist();
  S.news=news.map(n=>`<p class="note"><b>その間に：${n.t}</b><br>${n.d}</p>`).join('');
  card((S.turn?`<p class="note">${S.turn}</p>`:'')+S.news+head(sq)+'<div class="opts">'+S.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">${o.l}${o.need?`<small>賭け：サイコロ(1〜6)で ${o.need} 以上なら成功</small>`:''}</button>`).join('')+'</div>');
  S.turn='';
}
function head(sq){
  return `<div class="meta"><span class="tag">${ROWS[S.row][0]}年</span><span class="tag who">${sq.who}として選ぶ</span>${STOPS.includes(S.row)?'<span class="tag">関所</span>':''}</div><h2>${sq.t}</h2><p>${sq.d}</p>`;
}
async function pick(i){
  if(S.busy)return; S.busy=true;
  const sq=S.sq,o=S.opts[i]; let res=o,dice='';
  if(o.need){
    card(head(sq)+`<p class="chose">${o.l}</p><div class="rollrow"><div class="die" id="die">?</div><span>${o.need} 以上で成功…</span></div>`);
    const n=await spin(6); await sleep(500);
    const ok=n>=o.need; res=ok?o.ok:o.ng;
    dice=`<p class="note">出目 <b>${n}</b> — ${ok?'成功':'失敗'}</p>`;
  }
  apply(res.e);
  S.hist.push({y:ROWS[S.row][0],l:S.lane,t:sq.t,c:o.l}); hist();
  render(false);
  card(head(sq)+`<p class="chose">${o.l}</p>${dice}<p class="lead">どうなったか</p><p class="result">${res.r}</p>${prfx(res.e)}<button class="go" onclick="next()">${S.row>=22?'結末を見る':'次の1コマへ'}</button>`);
  S.busy=false;
}
function next(){
  if(S.pr>=6){
    S.pr=2; apply([0,3,0,0]);
    S.hist.push({y:ROWS[S.row][0],l:1,t:'抜け駆け'}); hist();
    card(`<div class="meta"><span class="tag">${ROWS[S.row][0]}年</span><span class="tag">競争圧が限界に</span></div><h2>抜け駆け</h2><p>安全確認に時間をかけている間に、規制の緩い開発者が検証なしの最先端モデルを公開した。慎重だった側は、選択を迫られる。</p>${prfx([0,0,0,-4])}<button class="go" onclick="next2()">次へ</button>`);
    return;
  }
  next2();
}
function next2(){
  const cur=S.lane, best=[0,1,2].filter(i=>i!==cur).sort((a,b)=>S.g[b]-S.g[a]||Math.random()-.5)[0];
  if(S.g[best]>=S.g[cur]+2){ S.lane=best; S.turn='歴史の流れが、静かに向きを変えた。'; }
  advance();
}
function ending(){
  const l=S.lane, ru=[0,1,2].filter(i=>i!==l).sort((a,b)=>S.g[b]-S.g[a])[0], key=l+'-'+ru, E=ENDINGS[key];
  let seen=[]; try{seen=JSON.parse(localStorage.getItem('agi-sugoroku-endings')||'[]'); if(!seen.includes(key))seen.push(key); localStorage.setItem('agi-sugoroku-endings',JSON.stringify(seen));}catch(e){seen=[key];}
  S.end=l; S.row=23;
  render(false);status();hist();
  card(`<div class="end"><div class="meta"><span class="tag">2046年以降</span><span class="tag lane bg${K[l]}">あがり</span></div>
  ${S.turn?`<p class="note">${S.turn}</p>`:''}
  <h2 class="t${K[l]}">${E[0]}</h2><p><b>${E[1]}</b></p><p class="result">${E[2]}</p>
  <p class="note">盤面の色は、そのとき歴史がどの流れの中にあったかを示す（<b class="tH">統治</b>・<b class="tP">並列</b>・<b class="tA">AGI</b>）。結末は三つの行き先 × 二つの形で6通り。これまでに見たのは ${seen.length} / 6。</p>
  <button class="go" onclick="reset()">もう一度、2026年から</button></div>`);
}

reset();
</script>
</body>
</html>
